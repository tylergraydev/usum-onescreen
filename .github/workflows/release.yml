name: Release

# Pushing a tag like v0.1.0 builds the plugin, Windows player exe and offline zip,
# and attaches them to a draft GitHub Release for that tag. Publishing the draft is done by hand.
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      # The tag must match the version in usum-onescreen.plgInfo (v<Major>.<Minor>.<Revision>).
      - name: Check tag matches plgInfo version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(awk '/Major:/{ma=$2} /Minor:/{mi=$2} /Revision:/{re=$2} END{print "v" ma "." mi "." re}' usum-onescreen.plgInfo)
          echo "tag $TAG, plgInfo $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match usum-onescreen.plgInfo version $VERSION"
            exit 1
          fi

      # Same steps as build.yml.
      # libctrpf and 3gxtool come from the ThePixellizerOSS package repo, not devkitPro's.
      # The script syncs only that repo (pkg.devkitpro.org's -Sy sometimes answers 403),
      # with retries, and falls back to the copies cached here by an earlier run.
      - name: Restore cached libctrpf and 3gxtool
        id: pkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-pkgs
          key: tpo-pkgs-v1-
          restore-keys: tpo-pkgs-v1-

      - name: Install libctrpf and 3gxtool
        run: sh tools/ci/install-deps.sh .ci-pkgs

      - name: Save libctrpf and 3gxtool for later runs
        if: steps.pkg-cache.outputs.cache-matched-key != format('tpo-pkgs-v1-{0}', hashFiles('.ci-pkgs/*'))
        uses: actions/cache/save@v4
        with:
          path: .ci-pkgs
          key: tpo-pkgs-v1-${{ hashFiles('.ci-pkgs/*') }}

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: usum-onescreen
          path: usum-onescreen.3gx
          if-no-files-found: error

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: usum-onescreen

      - name: Download and verify Azahar 2126.2
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'azahar.zip'
          Invoke-WebRequest 'https://github.com/azahar-emu/azahar/releases/download/2126.2/azahar-windows-msvc-2126.2.zip' -OutFile $archive
          $expected = '4412eac8d13123c8840f11890fc26e5b0e4c76d16aa28a608941377b948a9db0'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'Azahar SHA-256 mismatch; refusing to bundle.'
          }
          $unpacked = Join-Path $env:RUNNER_TEMP 'azahar-unpacked'
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          $exe = @(Get-ChildItem -LiteralPath $unpacked -Filter azahar.exe -File -Recurse)
          if ($exe.Count -ne 1) { throw 'Expected exactly one azahar.exe in the archive.' }
          "AZAHAR_DIR=$($exe[0].DirectoryName)" >> $env:GITHUB_ENV

      - name: Download and verify Azahar licence
        shell: pwsh
        run: |
          $license = Join-Path $env:RUNNER_TEMP 'azahar-license.txt'
          Invoke-WebRequest 'https://raw.githubusercontent.com/azahar-emu/azahar/2126.2/license.txt' -OutFile $license
          $bytes = [IO.File]::ReadAllBytes($license)
          $header = [Text.Encoding]::ASCII.GetBytes("blob $($bytes.Length)`0")
          $sha1 = [Security.Cryptography.SHA1]::Create()
          try {
            $hash = [BitConverter]::ToString($sha1.ComputeHash([byte[]]($header + $bytes))).Replace('-', '').ToLowerInvariant()
          } finally {
            $sha1.Dispose()
          }
          if ($hash -ne '7b0e5ad1bddc73ac44aca523174d22ee0d0dcc56') {
            throw 'Azahar licence git blob hash mismatch; refusing to bundle.'
          }
          "AZAHAR_LICENSE=$license" >> $env:GITHUB_ENV

      - name: Build and package Windows player
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ./player/build.ps1 -AzaharDir $env:AZAHAR_DIR -AzaharLicense $env:AZAHAR_LICENSE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python player/test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item player/dist/UsumOneScreen.exe "UsumOneScreen-$env:TAG.exe"
          Compress-Archive -Path player/dist/* -DestinationPath "usum-onescreen-$env:TAG-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: usum-onescreen-windows
          path: |
            usum-onescreen-*-windows.zip
            UsumOneScreen-*.exe
          if-no-files-found: error

  # Runs outside the devkitARM container, where the gh CLI is preinstalled.
  release:
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: usum-onescreen

      - uses: actions/download-artifact@v4
        with:
          name: usum-onescreen-windows

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" usum-onescreen.3gx "usum-onescreen-$TAG-windows.zip" "UsumOneScreen-$TAG.exe" --clobber
          else
            gh release create "$TAG" usum-onescreen.3gx "usum-onescreen-$TAG-windows.zip" "UsumOneScreen-$TAG.exe" --draft --verify-tag \
              --title "USUM One Screen $TAG" \
              --notes "Windows players: run UsumOneScreen-$TAG.exe (downloads Azahar 2126.2 on first run; drag your own decrypted ROM and v1.2 update onto it, or a zip of them). The plugin is embedded. Offline option: unzip usum-onescreen-$TAG-windows.zip and run UsumOneScreen.exe (Azahar included). Supports Pokemon Ultra Sun or Ultra Moon (USA). No game files or keys provided. Manual install: usum-onescreen.3gx. Install and controls: docs/PLAYING.md. Changes: CHANGELOG.md."
          fi
