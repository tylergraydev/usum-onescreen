name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      # libctrpf and 3gxtool come from the ThePixellizerOSS package repo, not devkitPro's.
      - name: Add ThePixellizerOSS package repo
        run: |
          CONF=/opt/devkitpro/pacman/etc/pacman.conf
          if ! grep -Fxq "[thepixellizeross-lib]" "$CONF"; then
            printf '\n[thepixellizeross-lib]\nServer = https://thepixellizeross.gitlab.io/packages/any\nSigLevel = Optional\n' >> "$CONF"
          fi
          if ! grep -Fxq "[thepixellizeross-linux]" "$CONF"; then
            printf '\n[thepixellizeross-linux]\nServer = https://thepixellizeross.gitlab.io/packages/x86_64/linux\nSigLevel = Optional\n' >> "$CONF"
          fi

      - name: Install libctrpf and 3gxtool
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -Sl thepixellizeross-lib thepixellizeross-linux
          dkp-pacman -S --noconfirm --needed libctrpf 3gxtool

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: usum-onescreen
          path: usum-onescreen.3gx

  # Pure logic (input capture masking, settings parser) built and run on the PC side.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: make -C tests
      - name: Scenario files parse
        run: python3 -I tools/scenario.py --check scenarios/*.txt
