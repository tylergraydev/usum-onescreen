name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deps_offline:
        description: Install libctrpf/3gxtool only from the actions cache (tests the fallback)
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      # libctrpf and 3gxtool come from the ThePixellizerOSS package repo, not devkitPro's.
      # The script syncs only that repo (pkg.devkitpro.org's -Sy sometimes answers 403),
      # with retries, and falls back to the copies cached here by an earlier run.
      - name: Restore cached libctrpf and 3gxtool
        id: pkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-pkgs
          key: tpo-pkgs-v1-
          restore-keys: tpo-pkgs-v1-

      - name: Install libctrpf and 3gxtool
        run: sh tools/ci/install-deps.sh .ci-pkgs
        env:
          DEPS_OFFLINE: ${{ inputs.deps_offline && '1' || '0' }}

      - name: Save libctrpf and 3gxtool for later runs
        if: steps.pkg-cache.outputs.cache-matched-key != format('tpo-pkgs-v1-{0}', hashFiles('.ci-pkgs/*'))
        uses: actions/cache/save@v4
        with:
          path: .ci-pkgs
          key: tpo-pkgs-v1-${{ hashFiles('.ci-pkgs/*') }}

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: usum-onescreen
          path: usum-onescreen.3gx

  # Pure logic (input capture masking, settings parser) built and run on the PC side.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: make -C tests
      - name: Scenario files parse
        run: python3 -I tools/scenario.py --check scenarios/*.txt

  # The player app (player/, docs/PLAYER-APP.md). Builds it and checks that
  # `check` refuses a file that isn't a 3DS dump; no game files are used.
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: dotnet build player/UsumOneScreen.csproj -c Release
      - name: Refuses a non-ROM file
        shell: bash
        run: |
          set +e
          out=$(player/bin/Release/net48/UsumOneScreen.exe check player/README.md)
          code=$?
          echo "$out"
          [ "$code" = 1 ] && echo "$out" | grep -q "^refused: README.md: not a 3DS ROM"
      - uses: actions/upload-artifact@v4
        with:
          name: usum-onescreen-app
          path: player/bin/Release/net48/UsumOneScreen.exe
